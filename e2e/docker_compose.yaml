services:
  kafka:
    image: docker.io/apache/kafka:${KAFKA_VERSION:-4.1.1}
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://kafka:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  connect:
    image: docker.io/apache/kafka:${KAFKA_VERSION:-4.1.1}
    depends_on:
      - kafka
    ports:
      - "127.0.0.1::8083"
      # - "5005:5005"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      KAFKA_LOG4J_OPTS: -Dlog4j.configuration=file:/mnt/connect-log4j.properties
      # KAFKA_OPTS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - ${PWD}/e2e:/mnt
      - ${PWD}/target:/opt/connectors/kafka-eventbridge-sink
    command: ["/bin/bash","-c","env && /opt/kafka/bin/connect-standalone.sh /mnt/connect-standalone.properties"]

  localstack:
    image: docker.io/localstack/localstack:4.12.0
    ports:
      - "127.0.0.1::4566" # LocalStack Gateway

  # Test stub of the EventBridge Custom Event Bus (eventsv2) PutRawEvents API, run from compiled test
  # classes. Unauthenticated: binds 0.0.0.0 only inside the compose network; the host publish is
  # loopback-only.
  eventsv2-stub:
    image: docker.io/library/eclipse-temurin:17-jre
    environment:
      STUB_BIND: "0.0.0.0"
      STUB_PORT: "8080"
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ${PWD}/target/test-classes:/stub:ro
    command: ["java", "-cp", "/stub", "software.amazon.event.kafkaconnector.stub.EventsV2Stub"]
